<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Industries | SilkBridge</title><meta name="description" content="Industry lenses across the SilkBridge technology portfolio."><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/ecosystem.css"></head><body class="eco-page"><main><section class="eco-header"><div class="eco-shell"><span class="eco-kicker">Industry lenses</span><h1 class="eco-title">See the portfolio<br><span style="color:var(--teal)">through the buyer.</span></h1><p class="eco-lead">Portfolio mappings — not customer case studies. These lenses show where the specialist verticals and partner capabilities can be relevant.</p></div></section><section class="eco-section"><div class="eco-shell"><div class="eco-grid" id="grid"></div></div></section></main><script type="module">import{silkBridge}from"./assets/js/ecosystem-data.js";import{esc,renderNav,renderFooter}from"./assets/js/ecosystem-ui.js";renderNav();document.getElementById("grid").innerHTML=silkBridge.industries.map((x,i)=>'<article class="eco-card"><div class="eco-index">0'+(i+1)+'</div><h3>'+esc(x.name)+'</h3><p>'+esc(x.intro)+'</p><div class="eco-tags">'+x.verticals.map(id=>'<span class="eco-tag">'+esc(silkBridge.verticals.find(v=>v.id===id)?.title||id)+'</span>').join("")+'</div><p style="margin-top:18px;font-size:.78rem"><strong style="color:var(--text)">Portfolio examples:</strong> '+esc(x.partners.join(" · "))+'</p></article>').join("");renderFooter();</script></body></html>
