<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="assets/brand/silkbridge-logo-trim.png"><title>Partner | SilkBridge</title><meta name="description" content="SilkBridge partner profile"><meta property="og:title" content="Partner | SilkBridge"><meta property="og:description" content="SilkBridge partner profile"><meta property="og:type" content="website"><meta property="og:image" content="https://silkbridge.eu/assets/photos/10-worldmap-meeting.jpg"><meta property="og:image:alt" content="SilkBridge technology distribution and GCC market access"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Partner | SilkBridge"><meta name="twitter:description" content="SilkBridge partner profile"><meta name="twitter:image" content="https://silkbridge.eu/assets/photos/10-worldmap-meeting.jpg"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/ecosystem.css">  <link rel="canonical" href="https://silkbridge.eu/partner.html">
</head>
<body class="eco-page"><main id="app"></main><script type="module">
import{silkBridge}from"./assets/js/ecosystem-data.js";import{partnerBySlug,verticalById,esc,renderNav,renderFooter,track}from"./assets/js/ecosystem-ui.js";
renderNav();const logoMap={"scal-e":"scal-e.png","mysender":"mysender.png","avaya-aura":"avaya-aura.png","4a-med-crm":"amed-crm.png","signatus":"signatus.png","qualitum":"qualitum.png","rhythmus":"rhythmus.png","talentlyft":"talentlyft.png","sunfish":"sunfish.png","ewyse":"ewyse.png","improv3":"improv3.png","high-class-relocation":"high-class-relocation.png","rentlio":"rentlio.png","4spaces":"4spaces.png","sinago":"sinago.png","benchmarked":"benchmarked.png"};const url=new URL(location.href);url.hash="";const requestedSlug=url.searchParams.get("slug");url.search="";if(requestedSlug)url.searchParams.set("slug",requestedSlug);const slug=url.searchParams.get("slug")||"scal-e",p=partnerBySlug(slug),app=document.getElementById("app");
if(!p){app.innerHTML='<section class="eco-profile"><div class="eco-shell"><h1 class="eco-title">Profile not found.</h1><a class="eco-btn" href="ecosystem.html">Back to ecosystem</a></div></section>'}
else{const v=verticalById(p.vertical);url.searchParams.set("slug",p.slug);const canonical=document.querySelector('link[rel="canonical"]');if(canonical)canonical.href=url.toString();document.title=p.name+" | SilkBridge Partner";document.querySelector('meta[name="description"]').content=p.short;track("partner_view",{partner:p.slug});
const related=silkBridge.partners.filter(x=>x.vertical===p.vertical&&x.slug!==p.slug).slice(0,3);
app.innerHTML='<section class="eco-profile"><div class="eco-shell"><a class="eco-link" href="ecosystem.html">← Partner ecosystem</a><div class="eco-profile-grid" style="margin-top:34px"><div><div class="meta">'+esc(v?.index||"")+' · '+esc(v?.title||"Partner")+'</div><h1>'+esc(p.name)+'</h1><p class="eco-lead">'+esc(p.short)+'</p><div class="eco-tags">'+p.capabilities.map(x=>'<span class="eco-tag">'+esc(x)+"</span>").join("")+'</div><div class="partner-actions" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:30px">'+(p.website?'<a class="eco-btn" target="_blank" rel="noopener" href="'+esc(p.website)+'">Official website ↗</a>':"")+'<a class="eco-btn alt" href="contact.html?interest=Partner%20with%20SilkBridge">Talk to SilkBridge ↗</a></div></div><div class="partner-visual-stack"><div class="partner-hero-visual"><div class="partner-logo-large"><img src="assets/logos/'+esc(logoMap[p.slug]||"")+'" alt="'+esc(p.name)+' logo"></div><div class="partner-visual-meta"><span>'+esc(v?.title||"Technology partner")+'</span><b>GLOBAL TECHNOLOGY → SILKBRIDGE → GCC</b></div></div><div class="eco-panel"><h3>What it is</h3><p>'+esc(p.description)+'</p>'+(!p.verified?'<div class="eco-note">Partner profile. Details will be expanded from current partner-supplied materials.</div>':"")+'</div></div></div></div></section>'+
'<section class="eco-section partner-links-section"><div class="eco-shell"><div class="eco-section-head"><div><span class="eco-kicker">Partner links</span><h2>Visit the technology behind the profile.</h2></div><span class="eco-count">'+(p.website?'Official destination available':'SilkBridge profile')+'</span></div><div class="partner-link-panel">'+(p.website?'<a class="partner-link-main" target="_blank" rel="noopener" href="'+esc(p.website)+'"><span><small>OFFICIAL WEBSITE</small><strong>'+esc(p.name)+'</strong><em>'+esc(p.website.replace(/^https?:\/\//,"").replace(/\/$/,""))+'</em></span><b>↗</b></a>':'<div class="partner-link-main unavailable"><span><small>WEBSITE</small><strong>Link coming soon</strong><em>This partner profile is ready for partner-supplied destination details.</em></span></div>')+'</div></div></section>'+'<section class="eco-section"><div class="eco-shell eco-split"><div><span class="eco-kicker">Capabilities</span><h2>What this partner brings to the portfolio.</h2></div><div class="eco-list">'+p.capabilities.map(x=>'<div class="eco-item"><strong>'+esc(x)+'</strong><span>Relevant portfolio capability.</span></div>').join("")+'</div></div></section>'+
'<section class="eco-section"><div class="eco-shell eco-split"><div><span class="eco-kicker">Use cases</span><h2>Where the technology can fit.</h2></div><div class="eco-list">'+p.useCases.map(x=>'<div class="eco-item"><strong>'+esc(x)+'</strong><span>Representative use case based on the current profile.</span></div>').join("")+'</div></div></section>'+
'<section class="eco-section"><div class="eco-shell eco-split"><div><span class="eco-kicker">Industry lens</span><h2>Relevant business environments.</h2></div><div class="eco-list">'+p.industries.map(x=>'<div class="eco-item"><strong>'+esc(x)+'</strong><span>Portfolio mapping, not a customer case study.</span></div>').join("")+'</div></div></section><section class="eco-section partner-gcc-section"><div class="eco-shell eco-split"><div><span class="eco-kicker">GCC relevance</span><h2>Where SilkBridge adds the regional layer.</h2><p>SilkBridge connects the partner proposition with local market context, buyer conversations and the appropriate route to market across its regional footprint.</p></div><div class="eco-list"><div class="eco-item"><strong>Position</strong><span>Translate the global proposition into a clear regional business conversation.</span></div><div class="eco-item"><strong>Connect</strong><span>Map the capability to relevant industries, partners and identified needs.</span></div><div class="eco-item"><strong>Activate</strong><span>Create a practical next step from technology interest to a regional opportunity.</span></div><div class="eco-item"><strong>Grow</strong><span>Use partner feedback and market learning to build sustainable momentum.</span></div></div></div></section>'+
'<section class="eco-section"><div class="eco-shell"><span class="eco-kicker">More in '+esc(v?.title||"this vertical")+'</span><h2>Explore related partners.</h2><div class="eco-grid" style="margin-top:30px">'+related.map(x=>'<article class="eco-card"><div class="eco-index">'+esc(x.name)+'</div><h3>'+esc(x.name)+'</h3><p>'+esc(x.short)+'</p><a class="eco-link" href="partner.html?slug='+x.slug+'">View profile ↗</a></article>').join("")+'</div><p class="eco-note" style="margin-top:24px">Profiles use publicly available partner information where marked as verified. Additional detail can be provided by SilkBridge.</p></div></section>'}
renderFooter();
</script></body></html>
