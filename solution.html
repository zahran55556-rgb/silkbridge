<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solution | SilkBridge</title><meta name="description" content="SilkBridge solution vertical."><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/ecosystem.css">  <link rel="canonical" href="https://silkbridge.eu/solution.html">
</head><body class="eco-page"><main id="app"></main><script type="module">import{silkBridge}from"./assets/js/ecosystem-data.js";import{verticalById,esc,renderNav,renderFooter,track}from"./assets/js/ecosystem-ui.js";renderNav();const url=new URL(location.href);url.hash="";const slug=url.searchParams.get("slug")||"marketing",v=verticalById(slug),app=document.getElementById("app");if(v){url.searchParams.set("slug",v.id);const canonical=document.querySelector('link[rel="canonical"]');if(canonical)canonical.href=url.toString();document.title=v.title+" | SilkBridge";document.querySelector('meta[name="description"]').content=v.description;track("solution_view",{solution:v.id});const partners=silkBridge.partners.filter(p=>p.vertical===v.id);app.innerHTML='<section class="eco-header"><div class="eco-shell"><span class="eco-kicker">'+esc(v.index)+' · '+esc(v.title)+'</span><h1 class="eco-title">'+esc(v.title)+'<br><span style="color:var(--teal)">for regional opportunity.</span></h1><p class="eco-lead">'+esc(v.description)+'</p><div class="eco-tags" style="margin-top:25px">'+v.capabilities.map(x=>'<span class="eco-tag">'+esc(x)+'</span>').join("")+'</div></div></section><section class="eco-section"><div class="eco-shell eco-split"><div><span class="eco-kicker">Solution architecture</span><h2>Connect the capability to the business need.</h2><p>Need → regional context → technology match → deployment path → growth loop.</p></div><div class="eco-list">'+["Business need","Regional context","Technology match","Deployment path","Growth loop"].map((x,i)=>'<div class="eco-item"><span class="eco-index">0'+(i+1)+'</span><strong>'+x+'</strong><span>Define, connect and progress the opportunity.</span></div>').join("")+'</div></div></section><section class="eco-section"><div class="eco-shell"><span class="eco-kicker">Partner ecosystem</span><h2>Technology partners in this vertical.</h2><p class="eco-section-note">Explore each partner, review its capabilities and continue to the official technology destination where available.</p><div class="eco-grid" style="margin-top:28px">'+partners.map(p=>'<article class="eco-card"><div class="eco-index">'+esc(p.name)+'</div><h3>'+esc(p.name)+'</h3><p>'+esc(p.short)+'</p><div class="eco-tags">'+p.capabilities.slice(0,4).map(x=>'<span class="eco-tag">'+esc(x)+'</span>').join("")+'</div><div class="eco-card-actions"><a class="eco-link" href="partner.html?slug='+encodeURIComponent(p.slug)+'">View profile ↗</a>'+(p.website?'<a class="eco-site-link" href="'+esc(p.website)+'" target="_blank" rel="noopener noreferrer">Official website ↗</a>':'<span class="eco-site-pending">Official website pending</span>')+'</div></article>').join("")+'</div></div></section><section class="eco-section"><div class="eco-shell"><div class="eco-cta"><div><span class="eco-kicker">Regional opportunity</span><h2 style="margin:8px 0 0">Discuss a technology solution with SilkBridge.</h2></div><a class="eco-btn" href="contact.html?interest=Discuss%20a%20technology%20solution">Start a conversation ↗</a></div></div></section>'}else{app.innerHTML='<section class="eco-profile"><div class="eco-shell"><h1 class="eco-title">Solution not found.</h1><a class="eco-btn" href="solutions.html">Back to solutions</a></div></section>'}renderFooter();</script></body></html>
